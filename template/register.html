{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Movie Ticket Booking</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- RESET & VARIABLES (SAME AS LOGIN/HOME) ---------- */
  :root {
    --primary-orange: #F2994A;
    --primary-hover: #e67e22;
    --bg-color: #f8f9fa;
    --text-dark: #333333;
    --text-grey: #666666;
    --white: #ffffff;
    
    --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

  body {
    background-color: var(--bg-color);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    /* Center alignment */
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  /* --- BACKGROUND SHAPE (ORANGE CURVE) --- */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    right: 0;
    width: 55vw;
    height: 100vh;
    background: var(--primary-orange);
    border-bottom-left-radius: 100%;
    z-index: -1;
    opacity: 0.9;
  }

  /* --- REGISTER CONTAINER (GLASS/BLUR EFFECT) --- */
  .login-container {
    /* Transparent white for glass effect */
    background: rgba(255, 255, 255, 0.25);
    /* The Blur Magic */
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: var(--shadow-glass);
    
    width: 100%;
    max-width: 500px; /* Wider for registration form */
    padding: 40px;
    border-radius: 20px;
    text-align: center;
  }

  h1 {
    font-size: 2rem;
    color: var(--text-dark);
    margin-bottom: 10px;
    font-weight: 700;
  }

  .sub-text {
    color: var(--text-grey);
    font-size: 0.9rem;
    margin-bottom: 30px;
  }

  /* --- DJANGO FORM STYLING --- */
  /* Targeting paragraphs generated by as_p */
  form p {
    text-align: left;
    margin-bottom: 15px;
  }

  /* Labels */
  label {
    display: block;
    margin-bottom: 5px;
    color: var(--text-dark);
    font-size: 0.9rem;
    font-weight: 600;
    padding-left: 10px;
  }

  /* Input Fields (Targeting all common types) */
  input[type="text"],
  input[type="email"],
  input[type="password"],
  input[type="number"],
  input[type="file"] {
    width: 100%;
    padding: 12px 20px;
    border: 1px solid #eee;
    border-radius: 50px; /* Pill shape */
    background: rgba(255, 255, 255, 0.8);
    font-size: 1rem;
    outline: none;
    transition: 0.3s;
    color: var(--text-dark);
  }

  /* File input specific adjustment */
  input[type="file"] {
    padding: 10px;
    border-radius: 15px; /* Less rounded for file input looks better */
    background: #fff;
  }

  /* Focus State */
  input:focus {
    border-color: var(--primary-orange);
    background: var(--white);
    box-shadow: 0 0 10px rgba(242, 153, 74, 0.2);
  }

  /* Help text (if any) */
  .helptext {
    font-size: 0.8rem;
    color: #777;
    padding-left: 15px;
    display: block;
    margin-top: 3px;
  }

  /* --- BUTTON --- */
  .btn {
    display: inline-block;
    width: 100%;
    padding: 12px 35px;
    border-radius: 50px;
    background: var(--primary-orange);
    color: var(--white);
    border: none;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: .3s ease;
    box-shadow: 0 4px 10px rgba(242, 153, 74, 0.3);
    margin-top: 20px;
  }
  
  .btn:hover {
    background: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(242, 153, 74, 0.4);
  }

  /* --- LINKS --- */
  .extra-buttons {
    margin-top: 25px;
    font-size: 0.9rem;
    color: var(--text-dark);
  }

  .extra-buttons a {
    color: var(--primary-orange);
    text-decoration: none;
    font-weight: 600;
  }

  .extra-buttons a:hover {
    text-decoration: underline;
  }

  /* Mobile Responsive */
  @media(max-width:768px){
    body::before { width: 100vw; height: 30vh; border-radius: 0 0 50% 50%; }
    .login-container { margin-top: 50px; }
  }
</style>
</head>
<body>

    <div class="login-container">
        <h1>Create Account</h1>
        <p class="sub-text">Join us to book your favorite movies!</p>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="btn">Register</button>
        </form>
        
        <div class="extra-buttons">
            <p>Already have an account? <a href="{% url 'login' %}">Login Here</a></p>
        </div>
    </div>

</body>
</html>
