{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Movie Ticket Booking</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- RESET & VARIABLES (SAME AS HOME) ---------- */
  :root {
    --primary-orange: #F2994A;
    --primary-hover: #e67e22;
    --bg-color: #f8f9fa;
    --text-dark: #333333;
    --text-grey: #666666;
    --white: #ffffff;
    
    --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

  body {
    background-color: var(--bg-color);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    /* Centering the login box */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* --- BACKGROUND SHAPE (ORANGE CURVE) --- */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    right: 0;
    width: 55vw;
    height: 100vh;
    background: var(--primary-orange);
    border-bottom-left-radius: 100%;
    z-index: -1;
    opacity: 0.9;
  }

  /* --- LOGIN CONTAINER (GLASS/BLUR EFFECT) --- */
  .login-container {
    /* Transparent white for glass effect */
    background: rgba(255, 255, 255, 0.25);
    /* The Blur Magic */
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: var(--shadow-glass);
    
    width: 100%;
    max-width: 400px;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    margin: 20px;
  }

  h1 {
    font-size: 2rem;
    color: var(--text-dark);
    margin-bottom: 30px;
    font-weight: 700;
  }

  /* --- INPUT FIELDS --- */
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px 20px;
    margin-bottom: 20px;
    border: 1px solid #eee;
    border-radius: 50px; /* Pill shape inputs */
    background: rgba(255, 255, 255, 0.8);
    font-size: 1rem;
    outline: none;
    transition: 0.3s;
    color: var(--text-dark);
  }

  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: var(--primary-orange);
    background: var(--white);
    box-shadow: 0 0 10px rgba(242, 153, 74, 0.2);
  }

  /* --- BUTTON (SAME AS HOME) --- */
  .btn {
    display: inline-block;
    width: 100%;
    padding: 12px 35px;
    border-radius: 50px;
    background: var(--primary-orange);
    color: var(--white);
    border: none;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: .3s ease;
    box-shadow: 0 4px 10px rgba(242, 153, 74, 0.3);
    margin-top: 10px;
  }
  
  .btn:hover {
    background: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(242, 153, 74, 0.4);
  }

  /* --- LINKS & TEXT --- */
  .extra-buttons {
    margin-top: 25px;
    font-size: 0.9rem;
    color: var(--text-dark);
  }

  .extra-buttons a {
    color: var(--primary-orange); /* Orange Link to match theme */
    text-decoration: none;
    font-weight: 600;
  }

  .extra-buttons a:hover {
    text-decoration: underline;
  }

  /* Error Message Style */
  .error-msg {
    color: #e74c3c;
    background: rgba(255, 255, 255, 0.8);
    padding: 10px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 0.9rem;
    font-weight: 500;
  }

  /* Mobile Responsive */
  @media(max-width:768px){
    body::before { width: 100vw; height: 40vh; border-radius: 0 0 50% 50%; }
  }
</style>
</head>
<body>

    <div class="login-container">
        <h1>Login</h1>
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div>
                <input type="email" name="email" id="id_email" placeholder="Enter your Email" required>
            </div>
            
            <div>
                <input type="password" name="password1" id="id_password1" placeholder="Enter Password" required>
            </div>
            
            <button type="submit" class="btn">Login</button>
        </form>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <div class="extra-buttons">
            <p>Don't have an account? <a href="{% url 'register' %}">Register Here</a></p>
        </div>
    </div>

</body>
</html>
